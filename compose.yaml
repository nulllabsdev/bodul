services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      BODUL_SERVER_ADDR: 0.0.0.0:3000
      DATABASE_URL: postgres://bodul:bodul@db:5432/bodul
    ports:
      - "3000:3000"

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: bodul
      POSTGRES_USER: bodul
      POSTGRES_PASSWORD: bodul
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodul -d bodul"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
